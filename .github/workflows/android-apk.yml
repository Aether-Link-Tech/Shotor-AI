name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend URL the app should talk to (must end with /), e.g. https://my-server.example.com/ or http://192.168.1.20:8000/"
        required: false
        default: "http://10.0.2.2:8000/"
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Point debug build at your backend
        if: ${{ inputs.api_base_url != '' }}
        run: sed -i 's#http://10.0.2.2:8000/#${{ inputs.api_base_url }}#' app/build.gradle.kts
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShotorAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
