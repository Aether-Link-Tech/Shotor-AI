services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Inside the container 127.0.0.1 is the container itself, so reach Ollama on the host instead,
      # and keep the SQLite file inside the mounted data volume so it survives rebuilds.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: sqlite:////app/data/shot_or.db
    volumes:
      - ./backend/data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
